# 海库（haiku-wiki）一键部署：docker compose up -d
services:
  haiku-wiki:
    build: .
    image: haiku-wiki:latest
    container_name: haiku-wiki
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - GIN_MODE=release
      - DB_DRIVER=${DB_DRIVER:-sqlite}
      - DB_DSN=${DB_DSN:-}
      - JWT_SECRET=${JWT_SECRET:-haiku-wiki-dev-secret-change-me}
      - DATA_DIR=/app/data
    volumes:
      # 数据卷：SQLite 文件 + uploads/ 全部落盘持久化
      - haiku-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  haiku-data:
